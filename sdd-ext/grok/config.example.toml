# grok-sdd — example model providers for grok-build.
#
# This file is installed as ~/.grok/config.example.toml and is NEVER loaded by
# grok (grok reads ~/.grok/config.toml). It is a menu: copy the blocks you want
# into ~/.grok/config.toml and uncomment them.
#
# Concept: define a [model_providers.<id>] (base URL + auth + API backend), then
# one or more [model.<id>] that use it, then optionally pick a default under
# [models]. Keys come from environment variables via `env_key`, so nothing
# secret lives in the file. Full guide: docs/CUSTOM_MODELS.md in the repo.
#
# api_backend:  "chat_completions" (OpenAI-compatible, most common)
#             | "responses" (OpenAI Responses / xAI)
#             | "messages"  (Anthropic native)

# ── OpenAI ──────────────────────────────────────────────────────────────────
# export OPENAI_API_KEY=sk-...
# [model_providers.openai]
# base_url = "https://api.openai.com/v1"
# env_key = "OPENAI_API_KEY"
# api_backend = "chat_completions"
#
# [model.gpt-4o]
# model = "gpt-4o"
# model_provider = "openai"
# context_window = 128000

# ── OpenRouter (one endpoint → hundreds of models: Claude, Llama, Gemini…) ────
# export OPENROUTER_API_KEY=sk-or-...
# [model_providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# env_key = "OPENROUTER_API_KEY"
# api_backend = "chat_completions"
#
# [model.or-claude]
# model = "anthropic/claude-sonnet-4"
# model_provider = "openrouter"
# context_window = 200000
#
# [model.or-llama]
# model = "meta-llama/llama-3.3-70b-instruct"
# model_provider = "openrouter"
# context_window = 128000

# ── Local (Ollama / llama.cpp / LM Studio — OpenAI-compatible servers) ────────
# [model_providers.local]
# base_url = "http://localhost:11434/v1"   # Ollama's OpenAI-compatible endpoint
# env_key = "OLLAMA_API_KEY"               # any non-empty value; local servers ignore it
# api_backend = "chat_completions"
#
# [model.llama-local]
# model = "llama3.3"
# model_provider = "local"
# context_window = 128000

# ── Anthropic (native Messages API) ───────────────────────────────────────────
# export ANTHROPIC_API_KEY=sk-ant-...
# [model_providers.anthropic]
# base_url = "https://api.anthropic.com/v1"
# env_key = "ANTHROPIC_API_KEY"
# api_backend = "messages"
#
# [model_providers.anthropic.extra_headers]
# anthropic-version = "2023-06-01"
#
# [model.claude]
# model = "claude-opus-4-8"
# model_provider = "anthropic"
# context_window = 200000

# ── Pick your default model (else grok keeps its built-in default) ────────────
# [models]
# default = "gpt-4o"
